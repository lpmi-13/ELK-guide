<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kibana telemetry workspace</title>
  <style>
    html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; background: #101820; color: white; }
    body { display: grid; grid-template-rows: 42px 1fr; }
    header { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
    #status { color: #f5a700; } #status.online { color: #35c98b; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
  </style>
</head>
<body>
  <header><strong>Kibana workspace</strong><span id="status">connecting telemetry…</span></header>
  <iframe id="kibana" title="Kibana dashboard"></iframe>
  <script>
    const kibanaUrl = __KIBANA_URL__;
    const frame = document.querySelector('#kibana');
    const status = document.querySelector('#status');
    const sessionId = crypto.randomUUID();
    let socket, pointerOverDashboard = false;
    frame.src = kibanaUrl;

    function send(type, details = {}) {
      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({type, session_id: sessionId, path: frame.src,
          viewport: `${innerWidth}x${innerHeight}`, ...details}));
      }
    }
    function connect() {
      socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
      socket.onopen = () => { status.textContent = 'telemetry connected'; status.className = 'online'; send('session_started'); };
      socket.onmessage = event => { const reply = JSON.parse(event.data); status.title = `Server: ${reply.type}`; };
      socket.onclose = () => { status.textContent = 'telemetry reconnecting…'; status.className = ''; setTimeout(connect, 1500); };
    }
    frame.addEventListener('load', () => send('dashboard_loaded'));
    frame.addEventListener('pointerenter', () => { pointerOverDashboard = true; send('dashboard_pointer_enter'); });
    frame.addEventListener('pointerleave', () => { pointerOverDashboard = false; send('dashboard_pointer_leave'); });
    window.addEventListener('blur', () => send(pointerOverDashboard ? 'dashboard_interaction' : 'window_blurred'));
    window.addEventListener('focus', () => send('window_focused'));
    document.addEventListener('visibilitychange', () => send(`page_${document.visibilityState}`));
    window.addEventListener('resize', () => send('viewport_resized'));
    setInterval(() => { if (!document.hidden) send('dashboard_active'); }, 15000);
    connect();
  </script>
</body>
</html>
