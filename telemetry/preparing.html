  <style>
    :root { color-scheme:dark; font:15px system-ui,sans-serif; background:#0d1721; color:#eef5fb; }
    body { margin:0;min-height:100vh;display:grid;place-items:center; }
    main { width:min(520px,calc(100% - 48px));padding:24px;text-align:center; }
    h1 { margin:0 0 10px;font-size:20px; }
    #msg { margin:0 0 18px;color:#c6d4df;line-height:1.5; }
    progress { width:100%;height:14px;border:0;border-radius:999px;background:#09121a;accent-color:#32b8eb; }
    progress::-webkit-progress-bar { border-radius:999px;background:#09121a;box-shadow:inset 0 0 0 1px #334b5e; }
    progress::-webkit-progress-value { border-radius:999px;background:linear-gradient(90deg,#1b78b5,#32b8eb); }
    progress::-moz-progress-bar { border-radius:999px;background:linear-gradient(90deg,#1b78b5,#32b8eb); }
    a { display:inline-block;margin-top:18px;padding:10px 16px;border-radius:6px;background:#1b78b5;color:#fff;font-weight:700;text-decoration:none; }
    a:focus-visible { outline:3px solid #ffb000;outline-offset:3px; }
    [hidden] { display:none; }
  </style>
</head>
<body>
  <main>
    <h1 id="h">Preparing your investigation…</h1>
    <p id="msg">Setting up evidence in Kibana…</p>
    <progress id="p" value="0" max="1000" aria-label="Investigation preparation progress"></progress>
    <p id="extra" hidden><a id="go" href="#">Open Kibana</a></p>
  </main>
  <script>
    (() => {
      const bar = document.querySelector('#p');
      // A manual refresh drops the __url/__done/__halt flags the opener tab pushes
      // onto this window, and the opener only signals once — so on its own the bar
      // would restart and never finish. The opener also mirrors the launch outcome
      // into this tab's sessionStorage; rehydrate from it so the page can complete,
      // or show its failure, by itself after a refresh.
      let store; try { store = window.sessionStorage; } catch (_error) { store = null; }
      const read = key => { try { return store ? store.getItem(key) : null; } catch (_error) { return null; } };
      const write = (key, value) => { try { if (store) store.setItem(key, value); } catch (_error) {} };
      if (window.__url == null) { const saved = read('prep:url'); if (saved) window.__url = saved; }
      if (window.__url) window.__done = true;
      if (read('prep:halt') === '1') window.__halt = true;
      if (window.__halt) {
        const set = (id, text) => { const el = document.getElementById(id); if (el && text) el.textContent = text; };
        const heading = read('prep:heading');
        if (heading) { document.title = heading; set('h', heading); }
        set('msg', read('prep:msg'));
        const extra = document.getElementById('extra'), go = document.getElementById('go'), link = read('prep:link');
        if (link && extra && go) { go.href = link; extra.hidden = false; }
      }
      // Keep one start time across refreshes so the bar resumes its curve instead
      // of snapping back to the beginning.
      let startedAt = Number(read('prep:started')) || 0;
      const fresh = !startedAt;
      if (fresh) { startedAt = Date.now(); write('prep:started', String(startedAt)); }
      let shown = fresh ? 40 : Math.min(985, 900 * (1 - Math.exp(-((Date.now() - startedAt) / 1000) / 5)));
      function step() {
        if (window.__halt) return;
        // Persist a URL pushed live so a refresh a moment later can still navigate.
        if (window.__url && read('prep:url') !== window.__url) write('prep:url', window.__url);
        const ceiling = window.__done ? 1000 : 900 * (1 - Math.exp(-((Date.now() - startedAt) / 1000) / 5));
        shown += (ceiling - shown) * (window.__done ? 0.2 : 0.08);
        if (!window.__done && shown > 985) shown = 985;
        bar.value = Math.min(Math.round(shown), 1000);
        if (window.__done && shown >= 999) {
          bar.value = 1000;
          document.title = 'Opening Kibana…';
          if (window.__url) location.replace(window.__url);
          return;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
