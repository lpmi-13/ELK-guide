name: elk-microservices-demo

x-service: &microservice
  build: ./microservice
  restart: unless-stopped
  environment: &service-environment
    LOG_DIR: /var/log/microservices
    LOG_INTERVAL_SECONDS: ${LOG_INTERVAL_SECONDS:-2}
  volumes:
    - service-logs:/var/log/microservices
  networks: [observability]
  depends_on:
    log-seeder:
      condition: service_completed_successfully

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.15.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [observability]

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-8.15.3}
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - service-logs:/var/log/microservices:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"
      - "9600:9600"
    networks: [observability]

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.15.3}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [observability]

  log-seeder:
    build: ./microservice
    command: [python, /app/seed.py]
    environment:
      LOG_DIR: /var/log/microservices
      SEED_COUNT: "500"
    volumes:
      - service-logs:/var/log/microservices
    networks: [observability]

  api-gateway:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: api-gateway
      PORT: "8080"
      DEPENDENCIES: http://auth:8081,http://catalog:8082,http://orders:8083
    ports: ["8080:8080"]

  auth:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: auth
      PORT: "8081"

  catalog:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: catalog
      PORT: "8082"

  orders:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: orders
      PORT: "8083"
      DEPENDENCIES: http://catalog:8082,http://payments:8084

  payments:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: payments
      PORT: "8084"

  browser-telemetry:
    build: ./telemetry
    restart: unless-stopped
    environment:
      LOG_DIR: /var/log/microservices
      PORT: "8090"
      KIBANA_URL: http://localhost:5601
    volumes:
      - service-logs:/var/log/microservices
    ports:
      - "8090:8090"
    depends_on:
      kibana:
        condition: service_healthy
      log-seeder:
        condition: service_completed_successfully
    networks: [observability]

volumes:
  elasticsearch-data:
  service-logs:

networks:
  observability:
