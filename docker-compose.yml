name: elk-microservices-demo

x-service: &microservice
  build: ./microservice
  restart: unless-stopped
  environment: &service-environment
    LOG_DIR: /var/log/microservices
    LOG_INTERVAL_SECONDS: ${LOG_INTERVAL_SECONDS:-2}
  volumes:
    - service-logs:/var/log/microservices
  networks: [observability]
  depends_on:
    log-seeder:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:'+os.environ['PORT']+'/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.2}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "[::1]:9200:9200"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [observability]

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-9.5.2}
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - service-logs:/var/log/microservices:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5044:5044"
      - "[::1]:5044:5044"
      - "127.0.0.1:9600:9600"
      - "[::1]:9600:9600"
    networks: [observability]

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.2}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:5601
      XPACK_SECURITY_ENABLED: "false"
      XPACK_SECURITY_SHOWINSECURECLUSTERWARNING: "false"
      TELEMETRY_ENABLED: "false"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [observability]

  kibana-gateway:
    build:
      context: .
      dockerfile: kibana-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5601:5601"
      - "[::1]:5601:5601"
    depends_on:
      kibana:
        condition: service_healthy
      learning-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5601/incident-coach/runtime.json"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [observability]

  kibana-setup:
    image: curlimages/curl:8.10.1
    command: ["sh", "/setup/setup.sh"]
    environment:
      KIBANA_INTERNAL_URL: http://kibana:5601
    volumes:
      - ./kibana:/setup:ro
    depends_on:
      kibana:
        condition: service_healthy
    networks: [observability]
    restart: "no"

  log-seeder:
    build: ./microservice
    command: [python, /app/seed.py]
    environment:
      LOG_DIR: /var/log/microservices
      SEED_COUNT: "500"
    volumes:
      - service-logs:/var/log/microservices
    networks: [observability]

  api-gateway:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: api-gateway
      PORT: "8080"
      DEPENDENCIES: http://auth:8081,http://catalog:8082,http://orders:8083
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"

  auth:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: auth
      PORT: "8081"

  catalog:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: catalog
      PORT: "8082"

  orders:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: orders
      PORT: "8083"
      DEPENDENCIES: http://catalog:8082,http://payments:8084

  payments:
    <<: *microservice
    environment:
      <<: *service-environment
      SERVICE_NAME: payments
      PORT: "8084"

  scenario-controller:
    build: ./scenario-controller
    restart: unless-stopped
    environment:
      PORT: "8092"
      SCENARIO: ${SCENARIO:-slow-payments}
      SCENARIO_SEED: ${SCENARIO_SEED:-20260822}
      SCENARIO_AUTO_START: ${SCENARIO_AUTO_START:-true}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_DIR: /var/log/microservices
    volumes:
      - service-logs:/var/log/microservices
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
      api-gateway:
        condition: service_healthy
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [observability]

  learning-service:
    build:
      context: .
      dockerfile: learning-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8091"
      SCENARIO_CONTROLLER_URL: http://scenario-controller:8092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_DIR: /var/log/microservices
      ALLOWED_ORIGINS: http://localhost:5601,http://127.0.0.1:5601,http://localhost:8090
    volumes:
      - service-logs:/var/log/microservices
    ports:
      - "127.0.0.1:8091:8091"
      - "[::1]:8091:8091"
    depends_on:
      scenario-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [observability]

  browser-telemetry:
    build: ./telemetry
    restart: unless-stopped
    environment:
      LOG_DIR: /var/log/microservices
      PORT: "8090"
      KIBANA_URL: http://localhost:5601
      LEARNING_URL: http://localhost:8091
    volumes:
      - service-logs:/var/log/microservices
    ports:
      - "127.0.0.1:8090:8090"
      - "[::1]:8090:8090"
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
      learning-service:
        condition: service_healthy
      log-seeder:
        condition: service_completed_successfully
    networks: [observability]

  scenario-recorder:
    profiles: [recording]
    build:
      context: .
      dockerfile: scenario-recorder/Dockerfile
    environment:
      LEARNING_URL: http://learning-service:8091
      KIBANA_URL: http://kibana:5601/app/discover#/view/incident-investigation
      SCENARIO_SEED: ${SCENARIO_SEED:-20260822}
      RECORDING_DIR: /recordings
    volumes:
      - ./recordings:/recordings
    depends_on:
      learning-service:
        condition: service_healthy
    networks: [observability]

volumes:
  elasticsearch-data:
  service-logs:

networks:
  observability:
