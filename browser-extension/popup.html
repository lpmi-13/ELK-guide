<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pair incident coach</title>
  <style>
    body { width: 310px; margin: 0; padding: 16px; color: #17212b; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { color: #536170; line-height: 1.4; }
    label { display: block; margin-top: 10px; font-weight: 650; }
    input { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 8px; border: 1px solid #a8b3be; border-radius: 5px; }
    button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 5px; color: white; background: #006bb4; font-weight: 700; cursor: pointer; }
    #status { min-height: 18px; color: #a33a00; }
  </style>
</head>
<body>
  <h1>Pair incident coach</h1>
  <p>This opts the current Kibana tab into visible tutorial automation. Use the session and short-lived code shown by the lab workspace.</p>
  <form id="pair-form">
    <label>Learning service<input id="server" type="url" value="http://localhost:8091" required></label>
    <label>Session ID<input id="session" autocomplete="off" placeholder="session-…" required></label>
    <label>Pairing code<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
    <button type="submit">Enable coach in this tab</button>
  </form>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
