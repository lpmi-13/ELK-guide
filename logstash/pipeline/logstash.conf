input {
  file {
    path => "/var/log/microservices/*.json"
    start_position => "beginning"
    sincedb_path => "/tmp/microservices.sincedb"
    codec => json
    mode => "tail"
  }
}

filter {
  if "_jsonparsefailure" in [tags] { drop { } }
  date { match => ["@timestamp", "ISO8601"] }
}

output {
  # Hourly indices so an ILM "delete @ 8h" policy can expire whole indices
  # without ever touching the one currently being written. The microservices-*
  # (etc.) data views still match these hourly names.
  if [event][dataset] == "learning.tutorial" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "tutorial-%{+YYYY.MM.dd.HH}"
    }
  } else if [event][dataset] == "scenario.control" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "scenario-%{+YYYY.MM.dd.HH}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "microservices-%{+YYYY.MM.dd.HH}"
    }
  }
  stdout { codec => dots }
}
