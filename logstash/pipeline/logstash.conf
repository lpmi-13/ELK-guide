input {
  file {
    path => "/var/log/microservices/*.json"
    start_position => "beginning"
    sincedb_path => "/tmp/microservices.sincedb"
    codec => json
    mode => "tail"
  }
}

filter {
  if "_jsonparsefailure" in [tags] { drop { } }
  date { match => ["@timestamp", "ISO8601"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-%{+YYYY.MM.dd}"
  }
  stdout { codec => dots }
}

