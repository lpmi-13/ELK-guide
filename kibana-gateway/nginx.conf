events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 5601;
    server_name _;
    client_max_body_size 20m;
    access_log off;

    location = /incident-coach/runtime.json {
      root /usr/share/nginx/html;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-store" always;
    }

    location /incident-coach/assets/ {
      alias /usr/share/nginx/html/incident-coach/assets/;
      add_header Cache-Control "no-store" always;
    }

    location /incident-coach/learning/ {
      proxy_pass http://learning-service:8091/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }

    location / {
      proxy_pass http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 180s;

      sub_filter_once on;
      sub_filter '</head>' '<script src="/incident-coach/assets/src/kibana-bootstrap.js"></script><script defer src="/incident-coach/assets/src/ui/cursor.js"></script><script defer src="/incident-coach/assets/src/ui/spotlight.js"></script><script defer src="/incident-coach/assets/src/ui/coach-panel.js"></script><script defer src="/incident-coach/assets/src/ui/debrief.js"></script><script defer src="/incident-coach/assets/src/adapters/common.js"></script><script defer src="/incident-coach/assets/src/adapters/discover.js"></script><script defer src="/incident-coach/assets/src/adapters/dashboard.js"></script><script defer src="/incident-coach/assets/src/adapters/apm.js"></script><script defer src="/incident-coach/assets/src/adapters/infrastructure.js"></script><script defer src="/incident-coach/assets/src/adapters/alerts.js"></script><script defer src="/incident-coach/assets/src/kibana-adapter.js"></script><script defer src="/incident-coach/assets/src/action-observer.js"></script><script defer src="/incident-coach/assets/src/session-client.js"></script><script defer src="/incident-coach/assets/src/content-script.js"></script></head>';
    }
  }
}
