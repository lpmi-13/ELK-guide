events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  server {
    listen 5601;
    server_name _;
    absolute_redirect off;
    client_max_body_size 20m;
    access_log off;

    # The remote playground exposes only this port. Keep the launcher, its
    # preparation page, and its telemetry socket on Kibana's browser origin.
    # Send only the root document to the launcher; an ingress path rewrite
    # would also rewrite its API, runtime, and WebSocket requests.
    location = / { return 302 /launcher/; }
    location = /launcher { return 302 /launcher/; }
    location /launcher/ {
      proxy_pass http://browser-telemetry:8090/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location = /preparing {
      proxy_pass http://browser-telemetry:8090;
      proxy_set_header Host $http_host;
    }
    location = /ws {
      proxy_pass http://browser-telemetry:8090;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 180s;
    }

    location = /incident-coach/runtime.json {
      root /usr/share/nginx/html;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-store" always;
    }

    location /incident-coach/assets/ {
      alias /usr/share/nginx/html/incident-coach/assets/;
      add_header Cache-Control "no-store" always;
    }

    # Keep Kibana's own SVG and PNG favicon links, but serve the lab icon at
    # their versioned URLs so the tab retains its icon after preparation.
    location ~ /ui/favicons/favicon\.svg$ {
      alias /usr/share/nginx/html/incident-coach/assets/favicon.svg;
      add_header Cache-Control "no-store" always;
    }

    location ~ /ui/favicons/favicon\.png$ {
      alias /usr/share/nginx/html/incident-coach/assets/favicon.png;
      add_header Cache-Control "no-store" always;
    }

    location = /favicon.ico {
      alias /usr/share/nginx/html/incident-coach/assets/favicon.ico;
      add_header Cache-Control "no-store" always;
    }

    location = /apple-touch-icon.png {
      alias /usr/share/nginx/html/incident-coach/assets/apple-touch-icon.png;
      add_header Cache-Control "no-store" always;
    }

    # This lab runs Kibana without security, so Fleet refuses every request. Infrastructure's pods view
    # asks it whether the Kubernetes integration is installed and shows the refusal as a large red toast
    # over the inventory. It isn't installed, so say that.
    location ~ ^(/s/[^/]+)?/api/fleet/epm/packages/kubernetes$ {
      default_type application/json;
      return 200 '{"item":{"name":"kubernetes","title":"Kubernetes","status":"not_installed"}}';
    }

    location /incident-coach/learning/ {
      proxy_pass http://learning-service:8091/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }

    location / {
      proxy_pass http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 180s;

      sub_filter_once on;
      sub_filter '</head>' '<script src="/incident-coach/assets/src/kibana-bootstrap.js"></script></head>';
    }
  }
}
